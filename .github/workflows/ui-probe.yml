name: UI probe

# Runs the app in an Android emulator: the instrumented tests in
# app/src/androidTest, plus a screenshot and layout measurements. Push a
# branch named ui/... or start it by hand; it takes a few minutes, so it
# is not part of every CI run.
on:
  push:
    branches: ["ui/**"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the app and the probe
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p probe
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb logcat -v time '*:W' > probe/logcat-all.txt 2>&1 &
            adb shell am instrument -w -e class io.github.leukoplast1980.solderless.PerfProbeTest io.github.leukoplast1980.solderless.debug.test/androidx.test.runner.AndroidJUnitRunner | tee probe/instrument.txt
            adb root; sleep 3; adb pull /sdcard/Android/data/io.github.leukoplast1980.solderless.debug/files/ probe/ || true
            adb logcat -d -s UiProbe:I PerfProbe:I > probe/logcat.txt || true
            adb shell getprop ro.build.version.release >> probe/logcat.txt
            grep -q "^OK (" probe/instrument.txt

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-probe
          path: probe/
